name: Build APK

on:
  push:
    branches:
      - claude/rotation-button-app
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # שם ייחודי לכל גרסה: מונע התנגשות עם הורדות קודמות בדפדפן,
      # שגורמת להורדה "להיתקע" בסוף בלי שהקובץ מופיע.
      - name: Read app version
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Prepare versioned APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             "RotationButton-v${{ steps.version.outputs.name }}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotationButton-debug
          path: RotationButton-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: RotationButton (debug build)
          body: |
            גרסת דיבאג להתקנה ישירה במכשיר.

            **הורידו את הקובץ:** `RotationButton-v${{ steps.version.outputs.name }}.apk`

            לכל גרסה שם קובץ ייחודי, כדי למנוע התנגשות עם הורדות קודמות בדפדפן.
            בהתקנה יש לאשר "התקנה ממקור לא ידוע".
          files: RotationButton-v${{ steps.version.outputs.name }}.apk
          prerelease: true
