name: Build APK

on:
  push:
    branches:
      - claude/rotation-button-app
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RotationButton-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to a downloadable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: RotationButton (debug build)
          body: |
            גרסת דיבאג להתקנה ישירה במכשיר.
            הורידו את הקובץ app-debug.apk והתקינו (יש לאשר "התקנה ממקור לא ידוע").
          files: app/build/outputs/apk/debug/app-debug.apk
          prerelease: true
