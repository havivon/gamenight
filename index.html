<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>🎉 משחקי המסיבה</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  /* Mature pastel palette: muted slate, dusty rose, sage, warm beige */
  --p1:#6b7a8f;       /* slate blue (primary) */
  --p2:#b8835a;       /* warm terracotta (secondary) */
  --p3:#c2a878;       /* soft amber (accent) */
  --p4:#88a888;       /* sage green */
  --p5:#8c9eaa;       /* dusty steel */
  --bg1:#f7f2ea;      /* cream */
  --bg2:#ece4d6;      /* light beige */
  --bg3:#dfd5c5;      /* warm beige */
  --card:#ffffff;
  --text:#2d3e50;
  --muted:#8898a6;
  --danger:#c47668;
  --success:#7aac7c;
  --border:#d9cfbe;
}
html,body{height:100%}
body{
  font-family:'Inter','Segoe UI','Heebo','Arial Hebrew',Arial,sans-serif;
  background:linear-gradient(135deg,var(--bg1) 0%,var(--bg2) 60%,var(--bg3) 100%);
  background-attachment:fixed;
  min-height:100vh;color:var(--text);
  display:flex;align-items:flex-start;justify-content:center;
  padding:20px;font-size:16px;
}
#app{width:100%;max-width:720px}
.card{
  background:var(--card);border-radius:18px;
  box-shadow:0 12px 32px -12px rgba(45,62,80,.18),0 4px 12px -4px rgba(45,62,80,.08);
  padding:32px;margin-bottom:20px;
  animation:fadeIn .2s ease both;
  position:relative;
  border:1px solid rgba(217,207,190,.5);
}
.timer-corner{
  position:absolute;top:14px;right:14px;
  background:var(--p1);color:white;
  font-weight:700;font-family:'Inter','Courier New',monospace;
  border-radius:10px;padding:7px 13px;font-size:1.15rem;
  box-shadow:0 3px 10px -2px rgba(107,122,143,.35);
  display:inline-flex;align-items:center;gap:6px;direction:ltr;
  letter-spacing:.02em;
}
.timer-corner.urgent{background:var(--danger);animation:pulse .8s infinite}
.footer-credit{
  text-align:center;color:var(--muted);font-size:.85rem;
  padding:8px 0 4px;font-weight:500;letter-spacing:.04em;
}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .35s}
h1{font-size:2.1rem;text-align:center;margin-bottom:6px;color:var(--p1);font-weight:700;letter-spacing:-.01em}
h2{font-size:1.4rem;text-align:center;margin-bottom:14px;color:var(--text);font-weight:700}
h3{font-size:1.05rem;margin-bottom:10px;color:var(--p1);font-weight:600}
.sub{text-align:center;color:var(--muted);margin-bottom:22px;font-size:.98rem}
.btn{
  display:block;width:100%;padding:14px 20px;border:none;border-radius:12px;
  font-size:1.05rem;font-weight:600;font-family:inherit;cursor:pointer;
  transition:transform .15s,box-shadow .15s,background .15s;
  margin-bottom:10px;color:white;letter-spacing:.01em;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(45,62,80,.3)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-p{background:var(--p1)}
.btn-p:hover{background:#5e6c80}
.btn-s{background:var(--p2)}
.btn-s:hover{background:#a87651}
.btn-g{background:var(--p4)}
.btn-g:hover{background:#7a9a7a}
.btn-mute{background:#94a3b8}
.btn-mute:hover{background:#7e8c9c}
.btn-sm{padding:9px 14px;font-size:.9rem;width:auto;display:inline-block;margin:4px}
input[type=text]{
  width:100%;padding:13px 16px;border:1.5px solid var(--border);border-radius:10px;
  font-size:1.05rem;font-family:inherit;direction:rtl;text-align:right;
  background:#fbfaf7;transition:border-color .2s,background .2s,box-shadow .2s;
  margin-bottom:12px;color:var(--text);
}
input[type=text]:focus{outline:none;border-color:var(--p1);background:white;box-shadow:0 0 0 3px rgba(107,122,143,.12)}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.code-box{
  background:#faf6ed;
  border-radius:14px;padding:22px;text-align:center;margin:18px 0;
  border:1.5px dashed var(--p3);
}
.code{font-size:2.2rem;font-weight:700;letter-spacing:.18em;color:var(--p2);font-family:'Inter','Courier New',monospace}
.code-hint{color:var(--muted);font-size:.9rem;margin-top:6px;font-weight:500}
.player-list{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;justify-content:center}
.player-chip{
  background:#f0ece2;color:var(--text);
  padding:7px 14px;border-radius:20px;font-weight:600;font-size:.9rem;
  display:inline-flex;align-items:center;gap:6px;
  border:1px solid var(--border);
}
.player-chip.team-a{background:#dee7ee;color:#3b556e;border-color:#b8c8d6}
.player-chip.team-b{background:#f0ddd5;color:#7a4a3d;border-color:#dcc1b4}
.player-chip.eliminated{filter:grayscale(.8);opacity:.55}
.player-chip.me::after{content:' (אני)';opacity:.85}
.team-zone{
  border-radius:18px;padding:14px;margin-bottom:12px;
}
.team-zone.a{background:#eef3f8;border:1.5px solid #b8c8d6}
.team-zone.b{background:#f7ebe5;border:1.5px solid #dcc1b4}
.team-zone h3{margin-bottom:8px}
.tile-row{
  display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
  margin:14px 0;direction:ltr;
}
.tile{
  width:48px;height:58px;
  background:#fbf7ee;
  border:1.5px solid var(--border);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;font-weight:700;color:var(--text);
  flex:0 0 auto;
}
.tile.gap{background:transparent;border:none;width:14px}
.answer-slots{
  display:flex;justify-content:center;gap:7px;flex-wrap:wrap;
  margin:14px 0 16px;direction:rtl;cursor:text;
  position:relative;padding:4px;
}
.slot{
  width:38px;height:50px;
  border-bottom:2.5px solid var(--p1);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:4px;
  font-size:1.7rem;font-weight:700;color:var(--text);
  background:transparent;
  transition:border-color .15s,background .15s;
}
.slot.filled{background:rgba(107,122,143,.06)}
.slot.active{border-color:var(--p2);background:rgba(184,131,90,.08)}
.slot-gap{width:14px}
.ghost-input{
  position:absolute;inset:0;width:100%;height:100%;
  opacity:0;border:none;background:transparent;
  font-size:16px;cursor:text;direction:rtl;
  padding:0;margin:0;
}
.topic-pill{
  display:inline-block;background:var(--p3);
  color:white;padding:7px 16px;border-radius:20px;font-weight:600;font-size:.95rem;
}
.letters-grid{
  display:flex;justify-content:center;gap:6px;margin:18px 0;flex-wrap:wrap;
  direction:ltr;
}
.letter-tile{
  width:56px;height:66px;
  background:#fbf7ee;
  border:1.5px solid var(--border);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
  font-size:2.5rem;font-weight:700;color:var(--text);
  flex:0 0 auto;
  box-shadow:0 1px 0 rgba(45,62,80,.04);
}
.timer{display:none}
.timer.urgent{display:none}
.score-table{
  width:100%;border-collapse:collapse;margin-top:16px;
}
.score-table th,.score-table td{
  padding:12px;text-align:right;border-bottom:1px solid #e5e7eb;
}
.score-table th{background:#f9fafb;color:var(--p1);font-weight:800}
.score-table tr:hover td{background:#fefce8}
.badge{
  display:inline-block;padding:3px 10px;border-radius:30px;font-size:.85rem;font-weight:700;margin-right:6px;
}
.badge.gold{background:#fef3c7;color:#92400e}
.badge.silver{background:#e5e7eb;color:#374151}
.badge.bronze{background:#fed7aa;color:#9a3412}
.msg{
  background:#eef3f8;color:#3b556e;padding:10px 14px;border-radius:8px;
  text-align:center;margin:8px 0;font-weight:500;border:1px solid #d4dde6;
}
.msg.success{background:#e6efe5;color:#456545;border-color:#bdd1bb}
.msg.error{background:#f5e2dd;color:#8b4a3e;border-color:#e0c0b6}
.msg.warning{background:#f5ebd9;color:#7c5a2e;border-color:#dec9a7}
.word-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.word-tag{
  background:#eef0f3;color:var(--text);padding:5px 11px;border-radius:14px;
  font-weight:500;font-size:.92rem;display:inline-flex;align-items:center;gap:4px;
  border:1px solid #dde2e8;
}
.word-tag.valid{background:#e6efe5;color:#456545;border-color:#bdd1bb}
.word-tag.invalid{background:#f5e2dd;color:#8b4a3e;text-decoration:line-through;border-color:#e0c0b6}
.word-tag.merged{background:#f5ebd9;color:#7c5a2e;border-color:#dec9a7}
.copy-btn{background:var(--p1);color:white;border:none;padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-family:inherit;font-size:.95rem}
.copy-btn:hover{background:#5e6c80}
.test-banner{
  background:#f5ebd9;color:#7c5a2e;border:1px solid #dec9a7;
  padding:7px;text-align:center;border-radius:8px;margin-bottom:12px;font-weight:500;font-size:.9rem;
}
.muted-text{color:var(--muted);text-align:center;font-size:.9rem}
.center{text-align:center}
.divider{height:2px;background:linear-gradient(90deg,transparent,#e5e7eb,transparent);margin:18px 0}
.spinner{
  display:inline-block;width:24px;height:24px;border:3px solid #e5e7eb;
  border-top-color:var(--p1);border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.float-emoji{position:fixed;font-size:2rem;pointer-events:none;animation:float 2s ease-out forwards;z-index:1000}
@keyframes float{
  0%{opacity:1;transform:translateY(0) scale(.5)}
  100%{opacity:0;transform:translateY(-200px) scale(1.5) rotate(45deg)}
}
.wc-last{
  text-align:center;margin:18px 0 10px;
  display:flex;flex-direction:column;gap:4px;
}
.wc-last-label{color:var(--muted);font-size:.85rem;font-weight:500}
.wc-last-word{font-size:1.6rem;font-weight:700;color:var(--text)}
.wc-prefix-box{
  background:#faf6ed;border:1.5px dashed var(--p3);
  border-radius:14px;padding:18px;text-align:center;margin:8px 0 18px;
  display:flex;flex-direction:column;gap:6px;
}
.wc-prefix-label{color:var(--muted);font-size:.95rem;font-weight:500}
.wc-prefix{
  font-size:2.4rem;font-weight:800;color:var(--p2);
  letter-spacing:.05em;font-family:'Inter','Arial Hebrew',Arial,sans-serif;
}
.wc-turn{
  text-align:center;padding:14px;border-radius:10px;
  background:#eef3f8;color:#3b556e;border:1px solid #d4dde6;
  font-weight:600;font-size:1.05rem;margin:10px 0 14px;
}
.wc-turn.me{
  background:#e6efe5;color:#456545;border-color:#bdd1bb;font-size:1.15rem;
  animation:gentle-pulse 1.6s ease-in-out infinite;
}
@keyframes gentle-pulse{0%,100%{box-shadow:0 0 0 0 rgba(122,172,124,.0)}50%{box-shadow:0 0 0 4px rgba(122,172,124,.2)}}
.wc-history{
  display:flex;flex-direction:column;gap:5px;margin-top:14px;
  background:#fbfaf7;border-radius:10px;padding:10px;
  border:1px solid var(--border);
}
.wc-history-row{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 0}
.wc-history-row.dropped{opacity:.5;text-decoration:line-through}
.wc-history-name{color:var(--muted);font-weight:600}
.wc-history-word{color:var(--text);font-weight:600}
.chain-history{
  display:flex;flex-direction:column;gap:6px;max-height:280px;overflow-y:auto;
  background:#f9fafb;border-radius:14px;padding:12px;margin:10px 0;
}
.chain-row{display:flex;align-items:center;gap:10px;padding:8px;background:white;border-radius:10px}
.chain-row.dropped{opacity:.5;text-decoration:line-through}
.required-letters{
  font-size:1.5rem;font-weight:700;color:var(--p2);
  background:#f7ebe2;padding:5px 14px;border-radius:8px;display:inline-block;
  border:1px solid #e3cdb6;
}
.test-controls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.test-controls .btn{flex:none;width:auto}
@media (max-width:520px){
  body{padding:8px}
  .card{padding:18px;border-radius:18px}
  h1{font-size:1.75rem}
  h2{font-size:1.3rem}
  h3{font-size:1.05rem}
  .btn{padding:14px 18px;font-size:1.05rem;margin-bottom:10px}
  input[type=text]{padding:14px 16px;font-size:16px}
  .tile{width:36px;height:46px;font-size:1.3rem;border-radius:8px}
  .tile.gap{width:12px}
  .letter-tile{width:40px;height:50px;font-size:1.5rem;border-radius:10px}
  .code{font-size:1.9rem;letter-spacing:.1em}
  .scrambled{font-size:2rem;padding:14px}
  .answer-hint{font-size:1.3rem;gap:3px}
  .hint-slot{width:18px}
  .timer{font-size:2rem}
  .topic-pill{font-size:.95rem;padding:6px 14px}
  .player-chip{font-size:.85rem;padding:6px 12px}
  .word-tag{font-size:.85rem;padding:5px 10px}
  .score-table th,.score-table td{padding:8px;font-size:.9rem}
  .required-letters{font-size:1.3rem;padding:5px 12px}
}
@media (max-width:380px){
  .tile{width:30px;height:40px;font-size:1.1rem}
  .letter-tile{width:34px;height:42px;font-size:1.25rem}
}
</style>
</head>

// PeerJS configuration - explicit secure settings + STUN/TURN for NAT traversal.
// Default 0.peerjs.com server can be flaky; explicit secure:true on https avoids
// silent http downgrades, and STUN/TURN helps friends on different networks.
const PEER_CONFIG = {
  debug: 1,
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:global.stun.twilio.com:3478' }
    ]
  }
};

function _setupPeerKeepAlive(p){
  // PeerJS sometimes silently disconnects from signaling server.
  // Reconnect automatically so the host stays reachable for joining clients.
  p.on('disconnected', () => {
    console.warn('Peer disconnected from signaling server, reconnecting...');
    setTimeout(()=>{ try { p.reconnect(); } catch(e){} }, 500);
  });
}

function startHost(name, onReady) {
  const code = genCode();
  // Use lowercase peer id (PeerJS server normalizes; some users had trouble with mixed-case)
  const peerId = 'gn-' + code.toLowerCase();
  peer = new Peer(peerId, PEER_CONFIG);
  let opened = false;
  peer.on('open', id => {
    if (opened) return;
    opened = true;
    state.isHost = true;
    state.myId = id;
    state.myName = name;
    state.gameCode = code;
    state.players[id] = { id, name, team:null, score:0, eliminated:false, connected:true };
    onReady && onReady();
  });
  peer.on('connection', conn => {
    conn.on('open', () => {
      clientConns[conn.peer] = conn;
    });
    conn.on('data', data => handleHostMessage(conn.peer, data));
    conn.on('close', () => {
      delete clientConns[conn.peer];
      if (state.players[conn.peer]) state.players[conn.peer].connected = false;
      broadcastState();
      render();
    });
  });
  peer.on('error', err => {
    console.error('Peer error:', err);
    if (err.type === 'unavailable-id'){
      // Clash on host id (rare with random codes). Regenerate.
      try { peer.destroy(); } catch(e){}
      setTimeout(()=>startHost(name, onReady), 200);
      return;
    }
    if (!opened) showToast('בעיית חיבור למארח: ' + (err.type || err.message), 'error');
  });
  _setupPeerKeepAlive(peer);
}

function joinAsClient(code, name, onReady, onErr) {
  const cleanCode = (code||'').trim().toUpperCase();
  const targetPeerId = 'gn-' + cleanCode.toLowerCase();
  let attempts = 0;

  function attempt(){
    attempts++;
    try { peer && peer.destroy(); } catch(e){}
    peer = new Peer(undefined, PEER_CONFIG);
    let myOpened = false;
    let connOpened = false;
    let errored = false;

    peer.on('open', id => {
      if (myOpened) return;
      myOpened = true;
      state.myId = id;
      state.myName = name;
      state.gameCode = cleanCode;
      const conn = peer.connect(targetPeerId, { reliable: true, metadata: { name } });
      hostConn = conn;
      conn.on('open', () => {
        connOpened = true;
        conn.send({ type:'join', name });
        onReady && onReady();
      });
      conn.on('data', data => handleClientMessage(data));
      conn.on('close', () => {
        showToast('הקשר עם המארח נסגר', 'error');
      });
      // Connection-establishment timeout (we ARE registered, just can't reach host)
      setTimeout(()=>{
        if (connOpened || errored) return;
        if (attempts < 2){ attempt(); return; }
        onErr && onErr('לא הצלחנו להתחבר. ודא שהמארח לא סגר את הדפדפן ושהקוד נכון.');
      }, 9000);
    });

    peer.on('error', err => {
      console.error('Client peer error:', err);
      if (err.type === 'peer-unavailable'){
        if (attempts < 2){ setTimeout(attempt, 1500); return; } // retry once after 1.5s
        errored = true;
        onErr && onErr('הקוד לא קיים או שהמארח עדיין לא מוכן. נסו שוב בעוד כמה שניות.');
        return;
      }
      if (err.type === 'network' || err.type === 'server-error'){
        if (attempts < 2){ setTimeout(attempt, 1500); return; }
      }
      errored = true;
      onErr && onErr('שגיאת חיבור: ' + (err.type || err.message || 'לא ידוע'));
    });
    _setupPeerKeepAlive(peer);
  }
  attempt();
}

function broadcast(msg) {
  Object.values(clientConns).forEach(c => { try { c.send(msg); } catch(e){} });
}

function broadcastTick(timeLeft){
  // Send only timer update so clients don't re-render fully
  broadcast({type:'tick', timeLeft});
}

function broadcastState() {
  // Send full state snapshot to all clients (excluding host)
  const snap = {
    type:'state',
    payload:{
      screen: state.screen,
      players: state.players,
      mode: state.mode,
      gameSequence: state.gameSequence,
      gameIndex: state.gameIndex,
      currentGame: state.currentGame,
      results: state.results,
      finalShown: state.finalShown,
      gameCode: state.gameCode,
    }
  };
  broadcast(snap);
}

function sendToHost(msg) {
  // Host-as-player and test mode: route directly to host handler
  if (state.isTest || state.isHost) {
    handleHostMessage(state.myId, msg);
    return;
  }
  if (hostConn && hostConn.open) hostConn.send(msg);
}

function handleHostMessage(fromId, msg) {
  // Host receives messages from clients
  if (!msg || !msg.type) return;
  if (msg.type === 'join') {
    state.players[fromId] = { id:fromId, name:msg.name, team:null, score:0, eliminated:false, connected:true };
    broadcastState(); render(); return;
  }
  if (msg.type === 'answer' && state.currentGame) {
    GameLogic.handleAnswer(fromId, msg);
    return;
  }
}

function handleClientMessage(msg) {
  if (!msg || !msg.type) return;
  if (msg.type === 'state') {
    Object.assign(state, msg.payload);
    render();
    return;
  }
  if (msg.type === 'toast') {
    showToast(msg.text, msg.kind);
    return;
  }
  if (msg.type === 'tick') {
    if (state.currentGame) state.currentGame.timeLeft = msg.timeLeft;
    if (!updateTimerOnly(msg.timeLeft)) render();
    return;
  }
}

function el(tag, attrs={}, ...children){
  const e = document.createElement(tag);
  for (const k in attrs){
    if (k === 'class') e.className = attrs[k];
    else if (k === 'style') e.style.cssText = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  for (const c of children){
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') e.appendChild(document.createTextNode(c));
    else e.appendChild(c);
  }
  return e;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

function scrambleLetters(word){
  // word: string (Hebrew). Returns scrambled letters as a string.
  // Final letters (ם,ן,ץ,ף,ך) are normalized to medial form so they don't
  // appear final-shaped mid-word after shuffling. Spaces are preserved so
  // the rendering layer can insert a gap between word boundaries.
  const finalToMedial = {'ם':'מ','ן':'נ','ץ':'צ','ף':'פ','ך':'כ'};
  const letters = word.replace(/\s+/g,'').split('').map(c => finalToMedial[c] || c);
  let arr = letters.slice();
  let attempts = 0;
  do { shuffleInPlace(arr); attempts++; } while (arr.join('')===letters.join('') && attempts<50);
  return arr.join('');
}
function shuffleInPlace(a){
  for (let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
}

function makeAnswerSlots(target, onSubmit){
  // target: array of word strings (1+) — builds underline slots whose
  // letters are filled in as the user types into a hidden input on top.
  const wrap = el('div', {class:'answer-slots'});
  const slots = [];
  target.forEach((word, wi)=>{
    if (wi>0) wrap.appendChild(el('div',{class:'slot-gap'}));
    for (let i=0;i<word.length;i++){
      const slot = el('div',{class:'slot'}, '');
      wrap.appendChild(slot);
      slots.push(slot);
    }
  });
  const total = slots.length;
  // No maxlength: it interferes with some IME / Hebrew keyboards.
  // We slice display in update(), and submit also slices.
  const ghost = el('input', {type:'text', class:'ghost-input', autocomplete:'off', autocorrect:'off', autocapitalize:'off', spellcheck:'false'});
  wrap.appendChild(ghost);

  function update(){
    const v = ghost.value.replace(/\s/g,'').slice(0, total);
    for (let i=0;i<slots.length;i++){
      const ch = v[i] || '';
      slots[i].textContent = ch;
      slots[i].classList.toggle('filled', !!ch);
      slots[i].classList.toggle('active', i === v.length && v.length < total);
    }
  }
  ghost.addEventListener('input', update);
  ghost.addEventListener('keydown', e => {
    if (e.key==='Enter'){ e.preventDefault(); onSubmit(ghost.value); }
  });
  wrap.addEventListener('click', ()=> ghost.focus());
  setTimeout(()=>{ ghost.focus(); update(); }, 50);
  return { wrap, ghost, clear:()=>{ ghost.value=''; update(); }, focus:()=>ghost.focus() };
}

function updateTimerOnly(timeLeft){
  // Update only the timer-corner in DOM to avoid full re-render flicker
  const t = document.querySelector('.timer-corner');
  if (!t) return false;
  t.textContent = '⏱ ' + timeLeft;
  if (timeLeft <= 10) t.classList.add('urgent'); else t.classList.remove('urgent');
  return true;
}

// Online Hebrew word check — uses multiple Wikimedia sources in parallel.
// Many Hebrew word forms (verb conjugations like "מבין") don't have their
// own Wiktionary entry, so we also check Wiktionary fulltext search and
// Wikipedia search, and accept if ANY source finds the word.
const wiktCache = new Map();
async function _checkPageExists(host, word){
  try {
    const url = `https://${host}/w/api.php?action=query&titles=${encodeURIComponent(word)}&format=json&origin=*&redirects=1`;
    const r = await fetch(url);
    const j = await r.json();
    const pages = j.query && j.query.pages || {};
    for (const id in pages){
      if (id !== '-1' && !pages[id].missing) return true;
    }
    return false;
  } catch(e){ return false; }
}
async function _checkSearch(host, word){
  try {
    const url = `https://${host}/w/api.php?action=query&list=search&srsearch=${encodeURIComponent('"'+word+'"')}&srlimit=1&format=json&origin=*`;
    const r = await fetch(url);
    const j = await r.json();
    const hits = (j.query && j.query.searchinfo && j.query.searchinfo.totalhits) || 0;
    return hits > 0;
  } catch(e){ return false; }
}
async function isHebrewWordOnline(word){
  if (!word) return false;
  const w = word.trim();
  if (!w) return false;
  if (wiktCache.has(w)) return wiktCache.get(w);
  // race multiple sources, accept first positive
  const sources = [
    _checkPageExists('he.wiktionary.org', w),
    _checkPageExists('he.wikipedia.org', w),
    _checkSearch('he.wiktionary.org', w),
    _checkSearch('he.wikipedia.org', w),
  ];
  const results = await Promise.all(sources);
  const exists = results.some(Boolean);
  wiktCache.set(w, exists);
  return exists;
}

function showToast(text, kind='success'){
  const t = el('div', {class:'msg '+(kind==='error'?'error':kind==='warning'?'warning':'success'),
    style:'position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.2);padding:14px 22px;font-size:1rem;'}, text);
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2800);
}

function emojiBurst(emoji='🎉'){
  for (let i=0;i<6;i++){
    const e = el('div',{class:'float-emoji', style:`left:${Math.random()*100}vw;top:${50+Math.random()*30}vh`}, emoji);
    document.body.appendChild(e);
    setTimeout(()=>e.remove(), 2200);

}

// Hebrew normalization for category answer matching
function normalizeHe(s){
  return (s||'').trim()
    .replace(/[\s׳']/g,'')
    .replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ץ/g,'צ').replace(/ף/g,'פ').replace(/ך/g,'כ')
    .toLowerCase();
}
function fuzzyHe(s){
  // Strip silent letters (matres lectionis: א, ה, ו, י), collapse
  // repeated consonants, and strip plural endings so:
  // "ירושליים"=="ירושלים", "אשה"=="אישה", "אגסים"=="אגס", "ענב"=="ענבים", etc.
  let n = normalizeHe(s).replace(/[אהוי]/g,'');
  n = n.replace(/(.)\1+/g, '$1');
  // strip plural endings: מ (was ים/ם), ת (was ות), and lone trailing ת/ה residue
  n = n.replace(/מ$/,'').replace(/ת$/,'');
  return n;
}

function canMakeFromLetters(word, letters){
  const counts = {};
  for (const ch of letters){
    const k = canonChar(ch);
    counts[k] = (counts[k]||0)+1;
  }
  for (const ch of word){
    const k = canonChar(ch);
    if (!counts[k]) return false;
    counts[k]--;
  }
  return true;
}
function canonChar(c){
  // Replace ALL final-letter forms with their medial form (the /g flag was missing)
  return c.replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ץ/g,'צ').replace(/ף/g,'פ').replace(/ך/g,'כ');
}

// Random Hebrew letters with weighted vowels for solvability
const HEB_LETTERS_POOL = 'אאבבגדההווחטיייכלללממננסעפצקררששתתבכפ'.split('');
function pickAnagramLetters(){
  // Try to pick 8 letters that have multiple valid words
  for (let attempts=0; attempts<200; attempts++){
    const set = [];
    const pool = HEB_LETTERS_POOL.slice();
    for (let i=0;i<8;i++){
      const idx = Math.floor(Math.random()*pool.length);
      set.push(pool[idx]);
    }
    const valid = HEBREW_WORDS_ALL.filter(w => w.length>=4 && w.length<=8 && canMakeFromLetters(w, set));
    if (valid.length >= 8) return { letters:set, valid };
  }
  // fallback known good
  const fallback = ['ש','ל','ו','ם','י','ר','ב','ת'];
  const valid = HEBREW_WORDS_ALL.filter(w => w.length>=4 && w.length<=8 && canMakeFromLetters(w, fallback));
  return { letters:fallback, valid };
}

/* ============================================================
   GAME LOGIC (host-side game flow)
   ============================================================ */

const GameLogic = {
  // Called by host to start a new full match
  startMatch(mode){
    state.mode = mode;
    state.gameSequence = ['unscramble','anagram','categories','wordchain','wordchain'];
    state.gameIndex = 0;
    // assign teams if needed
    const ids = Object.keys(state.players);
    ids.forEach(id => { state.players[id].score = 0; state.players[id].eliminated=false; state.players[id].team=null; });
    if (mode === 'teams'){
      const sh = shuffle(ids);
      sh.forEach((id,i)=> state.players[id].team = i%2===0 ? 'a' : 'b');
    }
    state.finalShown = false;
    this.startGame(state.gameSequence[state.gameIndex]);
  },

  startGame(name){
    state.screen = 'game';
    state.results = null;
    // Reset eliminations between games
    Object.values(state.players).forEach(p => p.eliminated = false);
    if (name === 'unscramble') Games.unscramble.start();
    else if (name === 'anagram') Games.anagram.start();
    else if (name === 'categories') Games.categories.start();
    else if (name === 'wordchain') Games.wordchain.start();
    broadcastState();
    render();
  },

  nextGame(){
    state.gameIndex++;
    if (state.gameIndex >= state.gameSequence.length){
      state.screen = 'final';
      state.finalShown = true;
      state.currentGame = null;
      broadcastState(); render();
      return;
    }
    this.startGame(state.gameSequence[state.gameIndex]);
  },

  replayMatch(){
    this.startMatch(state.mode);
  },

  backToLobby(){
    state.screen = 'lobby';
    state.currentGame = null;
    state.results = null;
    state.finalShown = false;
    Object.values(state.players).forEach(p => { p.score=0; p.eliminated=false; p.team=null; });
    broadcastState(); render();
  },

  handleAnswer(fromId, msg){
    if (!state.currentGame) return;
    const gName = state.currentGame.name;
    if (gName==='unscramble') Games.unscramble.onAnswer(fromId, msg);
    else if (gName==='anagram') Games.anagram.onAnswer(fromId, msg);
    else if (gName==='categories') Games.categories.onAnswer(fromId, msg);
    else if (gName==='wordchain') Games.wordchain.onAnswer(fromId, msg);
  },
};

   GAMES

const Games = {};

/* --- Game 1: Unscramble --- */
Games.unscramble = {
  ROUNDS: 8,
  ROUND_TIME: 20,
  start(){
    const used = new Set();
    const items = [];
    const pool = shuffle(UNSCRAMBLE_DATA);
    for (const it of pool){
      if (items.length >= this.ROUNDS) break;
      const key = Array.isArray(it.word)?it.word.join(' '):it.word;
      if (used.has(key)) continue;
      // Validate per requested rules: single word >= 6 letters, OR
      // each word in a phrase must be at least 3 letters.
      let valid = false;
      if (Array.isArray(it.word)){
        valid = it.word.length >= 2 && it.word.every(w => w.length >= 3) && key.replace(/\s/g,'').length <= 10;
      } else {
        valid = it.word.length >= 6 && it.word.length <= 9;
      }
      if (!valid) continue;
      used.add(key);
      items.push(it);
    }
    // pad with anything if not enough
    while (items.length < this.ROUNDS && pool.length){
      items.push(pool[items.length % pool.length]);
    }
    state.currentGame = {
      name:'unscramble',
      round: 0,
      items,
      timeLeft: this.ROUND_TIME,
      currentItem: null,
      currentScramble: '',
      winners: [], // per-round winner ids
      lastWinnerName: null,
      lastAnswer: null,
      phase: 'play', // 'play' | 'reveal'
    };
    this._nextRound();
  },
  _nextRound(){
    const g = state.currentGame;
    if (g.round >= this.ROUNDS){
      this._finishGame(); return;
    }
    g.currentItem = g.items[g.round];
    const target = Array.isArray(g.currentItem.word) ? g.currentItem.word.join('') : g.currentItem.word;
    g.currentScramble = scrambleLetters(target);
    g.timeLeft = this.ROUND_TIME;
    g.phase = 'play';
    g.lastWinnerName = null;
    this._tick();
    broadcastState(); render();
  },
  _tick(){
    clearTimeout(this._t);
    const g = state.currentGame;
    if (!g || g.name !== 'unscramble') return;
    if (g.phase !== 'play') return;
    if (g.timeLeft <= 0){
      g.phase = 'reveal';
      g.lastAnswer = Array.isArray(g.currentItem.word)?g.currentItem.word.join(' '):g.currentItem.word;
      broadcastState(); render();
      this._t = setTimeout(()=>{ g.round++; this._nextRound(); }, 3500);
      return;
    }
    g.timeLeft--;
    if (!updateTimerOnly(g.timeLeft)) render();
    broadcastTick(g.timeLeft);
    this._t = setTimeout(()=>this._tick(), 1000);
  },
  _checkAnswer(answer, item){
    const target = Array.isArray(item.word)?item.word.join(' '):item.word;
    const a = (answer||'').trim().replace(/\s+/g,' ');
    const norm = s => s.replace(/\s/g,'').replace(/ם/g,'מ').replace(/ן/g,'נ').replace(/ץ/g,'צ').replace(/ף/g,'פ').replace(/ך/g,'כ');
    return norm(a) === norm(target);
  },
  onAnswer(fromId, msg){
    const g = state.currentGame;
    if (!g || g.phase !== 'play') return;
    if (state.players[fromId] && state.players[fromId].eliminated) return;
    if (this._checkAnswer(msg.answer, g.currentItem)){
      // award
      const p = state.players[fromId];
      const lastAnswer = Array.isArray(g.currentItem.word)?g.currentItem.word.join(' '):g.currentItem.word;
      if (state.mode === 'teams' && p.team){
        // award team players
        Object.values(state.players).forEach(pp => { if (pp.team===p.team) pp.score += 10; });
      } else {
        p.score += 10;
      }
      g.lastWinnerName = p.name;
      g.lastAnswer = lastAnswer;
      g.phase = 'reveal';
      broadcastState(); render();
      clearTimeout(this._t);
      this._t = setTimeout(()=>{ g.round++; this._nextRound(); }, 3000);
    } else {
      // wrong - notify only
    }
  },
  _finishGame(){
    state.results = { game:'unscramble', message:'משחק 1 הסתיים!' };
    state.screen = 'roundResults';
    broadcastState(); render();
  },
};

/* --- Game 2: Anagram (8 letters, find 4+ letter words) --- */
Games.anagram = {
  ROUND_TIME: 90,
  start(){
    const { letters, valid } = pickAnagramLetters();
    state.currentGame = {
      name:'anagram',
      letters,
      validWords: valid,
      timeLeft: this.ROUND_TIME,
      submissions: {}, // entityId -> [words] (entity = playerId or team key)
      phase: 'play',
    };
    this._tick();
  },
  _tick(){
    clearTimeout(this._t);
    const g = state.currentGame;
    if (!g || g.name !== 'anagram') return;
    if (g.phase !== 'play') return;
    if (g.timeLeft <= 0){
      this._finish(); return;
    }
    g.timeLeft--;
    if (!updateTimerOnly(g.timeLeft)) render();
    broadcastTick(g.timeLeft);
    this._t = setTimeout(()=>this._tick(), 1000);
  },
  onAnswer(fromId, msg){
    const g = state.currentGame;
    if (!g || g.phase !== 'play') return;
    const word = (msg.answer||'').trim();
    if (!word) return;
    const entity = state.mode==='teams' ? state.players[fromId].team : fromId;
    if (!entity) return;
    g.submissions[entity] = g.submissions[entity] || [];
    if (g.submissions[entity].includes(word)) return;
    g.submissions[entity].push(word);
    broadcastState(); render();
  },
  async _finish(){
    const g = state.currentGame;
    g.phase = 'reveal';
    // Score per entity
    const scoring = {};
    const pendingOnline = []; // {entity, word}
    Object.entries(g.submissions).forEach(([entity, words])=>{
      const seen = new Set();
      const valid=[], invalid=[];
      for (const w of words){
        const cleaned = w.trim();
        if (!cleaned) continue;
        if (cleaned.length < 4) { invalid.push({w:cleaned, reason:'קצרה מ-4'}); continue; }
        if (!canMakeFromLetters(cleaned, g.letters)) { invalid.push({w:cleaned,reason:'לא מהאותיות'}); continue; }
        if (seen.has(cleaned)) continue;
        seen.add(cleaned);
        if (HEBREW_DICT.has(cleaned)) { valid.push(cleaned); continue; }
        invalid.push({w:cleaned,reason:'בודק...', online:true});
        pendingOnline.push({entity, word: cleaned});
      }
      scoring[entity] = { valid, invalid, points: 0 };
    });
    // Progressive scoring - longer words score significantly more
    const calcPts = arr => arr.reduce((s,w)=> s + (w.length>=8?80:w.length>=7?50:w.length>=6?30:w.length>=5?15:5), 0);
    Object.values(scoring).forEach(sc => sc.points = calcPts(sc.valid));

    // Show interim results immediately
    state.results = { game:'anagram', scoring, letters:g.letters, validWords:g.validWords, pending: pendingOnline.length };
    state.screen = 'roundResults';
    this._applyScores(scoring);
    broadcastState(); render();

    // Online verification for unknown words (parallel)
    if (pendingOnline.length){
      const checks = await Promise.all(pendingOnline.map(p => isHebrewWordOnline(p.word).then(ok => ({...p, ok}))));
      let any = false;
      for (const c of checks){
        if (c.ok){
          HEBREW_DICT.add(c.word);
          const sc = scoring[c.entity];
          if (!sc) continue;
          const idx = sc.invalid.findIndex(it=> it.w===c.word);
          if (idx>=0) sc.invalid.splice(idx,1);
          if (!sc.valid.includes(c.word)){ sc.valid.push(c.word); any = true; }
        } else {
          // Update reason on invalid items so user understands
          const sc = scoring[c.entity];
          const it = sc && sc.invalid.find(it=> it.w===c.word);
          if (it) it.reason = 'לא נמצאה במילון';
        }
      }
      if (any){
        Object.values(scoring).forEach(sc => sc.points = calcPts(sc.valid));
        this._undoScores();
        this._applyScores(scoring);
      }
      state.results.pending = 0;
      broadcastState(); render();
    }
  },
  _applyScores(scoring){
    if (state.mode==='teams'){
      Object.entries(scoring).forEach(([team, sc])=>{
        Object.values(state.players).forEach(p=>{ if (p.team===team) p.score += sc.points; });
      });
    } else {
      Object.entries(scoring).forEach(([id, sc])=>{
        if (state.players[id]) state.players[id].score += sc.points;
      });
    }
    state._lastAnagramScoring = JSON.parse(JSON.stringify(scoring));
  },
  _undoScores(){
    const prev = state._lastAnagramScoring || {};
    if (state.mode==='teams'){
      Object.entries(prev).forEach(([team, sc])=>{
        Object.values(state.players).forEach(p=>{ if (p.team===team) p.score -= sc.points; });
      });
    } else {
      Object.entries(prev).forEach(([id, sc])=>{
        if (state.players[id]) state.players[id].score -= sc.points;
      });
    }
  },
};

/* --- Game 3: Categories race --- */
Games.categories = {
  ROUND_TIME: 60,
  _recent: [],
  start(){
    // Avoid recent categories so user doesn't keep getting "ערי בירה"
    const recent = this._recent.slice(-Math.min(this._recent.length, Math.floor(CATEGORIES_DATA.length * 0.6)));
    const pool = CATEGORIES_DATA.filter(c => !recent.includes(c.name));
    const cat = (pool.length ? pool : CATEGORIES_DATA)[Math.floor(Math.random()*(pool.length||CATEGORIES_DATA.length))];
    this._recent.push(cat.name);
    state.currentGame = {
      name:'categories',
      category: cat.name,
      validAnswers: cat.answers,
      timeLeft: this.ROUND_TIME,
      submissions: {}, // entity -> [words]
      phase: 'play',
    };
    this._tick();
  },
  _tick(){
    clearTimeout(this._t);
    const g = state.currentGame;
    if (!g || g.name !== 'categories') return;
    if (g.phase !== 'play') return;
    if (g.timeLeft <= 0){ this._finish(); return; }
    g.timeLeft--;
    if (!updateTimerOnly(g.timeLeft)) render();
    broadcastTick(g.timeLeft);
    this._t = setTimeout(()=>this._tick(), 1000);
  },
  onAnswer(fromId, msg){
    const g = state.currentGame;
    if (!g || g.phase !== 'play') return;
    const word = (msg.answer||'').trim();
    if (!word) return;
    const entity = state.mode==='teams' ? state.players[fromId].team : fromId;
    if (!entity) return;
    g.submissions[entity] = g.submissions[entity] || [];
    g.submissions[entity].push(word);
    broadcastState(); render();
  },
  _finish(){
    const g = state.currentGame;
    g.phase = 'reveal';
    // Build a fuzzy index of valid answers
    const validIndex = new Map(); // fuzzyKey -> canonical
    g.validAnswers.forEach(a => {
      const k = fuzzyHe(a);
      if (!validIndex.has(k)) validIndex.set(k, a);
    });
    // For each entity, dedupe within entity and check validity
    const perEntity = {};
    Object.entries(g.submissions).forEach(([entity, words])=>{
      const seen = new Map(); // fuzzy key -> {original, count}
      for (const w of words){
        const k = fuzzyHe(w);
        if (!k) continue;
        if (seen.has(k)){ seen.get(k).count++; continue; }
        seen.set(k, {original:w, count:1, fuzzyKey:k});
      }
      const items = Array.from(seen.values()).map(it=>{
        const matchKey = it.fuzzyKey;
        const matched = validIndex.has(matchKey);
        return {
          original: it.original,
          merged: it.count>1,
          mergedCount: it.count,
          valid: matched,
          canonical: matched ? validIndex.get(matchKey) : null,
        };
      });
      const points = items.filter(i=>i.valid).length * 5;
      perEntity[entity] = { items, points };
    });
    // Apply scores
    if (state.mode==='teams'){
      Object.entries(perEntity).forEach(([team, sc])=>{
        Object.values(state.players).forEach(p=>{ if (p.team===team) p.score += sc.points; });
      });
    } else {
      Object.entries(perEntity).forEach(([id, sc])=>{
        if (state.players[id]) state.players[id].score += sc.points;
      });
    }
    state.results = { game:'categories', perEntity, category: g.category };
    state.screen = 'roundResults';
    broadcastState(); render();
  },
};

/* --- Game 4: Word Chain --- */
Games.wordchain = {
  TURN_TIME: 10,
  start(){
    // initial seed word
    const seedPool = HEBREW_WORDS.filter(w => w.length>=4 && w.length<=6);
    const seed = seedPool[Math.floor(Math.random()*seedPool.length)];
    // Determine play order
    const ids = Object.keys(state.players);
    const order = state.mode==='teams' ? this._teamInterleave(ids) : shuffle(ids);
    state.currentGame = {
      name:'wordchain',
      history: [{by:null, byName:'התחלה', word:seed, ok:true}],
      lastWord: seed,
      requiredPrefix: this._lastTwoLetters(seed),
      usedWords: new Set([canonChar(seed)]),
      order,
      turnIdx: 0,
      timeLeft: this.TURN_TIME,
      phase: 'play',
      winnerEntity: null,
    };
    // Set used as array for serialization
    state.currentGame.usedWordsArr = Array.from(state.currentGame.usedWords);
    this._beginTurn();
  },
  _teamInterleave(ids){
    const a = ids.filter(i=>state.players[i].team==='a');
    const b = ids.filter(i=>state.players[i].team==='b');
    shuffle(a); shuffle(b);
    const out=[];
    const len = Math.max(a.length, b.length);
    for (let i=0;i<len;i++){
      if (a[i]) out.push(a[i]);
      if (b[i]) out.push(b[i]);
    }
    return out;
  },
  _activeOrder(){
    return state.currentGame.order.filter(id => state.players[id] && !state.players[id].eliminated);
  },
  _lastTwoLetters(w){
    const clean = canonChar(w.replace(/\s/g,''));
    return clean.slice(-2);
  },
  _beginTurn(){
    const g = state.currentGame;
    const active = this._activeOrder();
    if (this._checkEnd(active)) return;
    g.turnIdx = g.turnIdx % active.length;
    g.currentPlayerId = active[g.turnIdx];
    g.timeLeft = this.TURN_TIME;
    g.phase = 'play';
    // Full render so input/turn-indicator update for the new player
    broadcastState(); render();
    this._tick();
  },
  _tick(){
    clearTimeout(this._t);
    const g = state.currentGame;
    if (!g || g.name !== 'wordchain') return;
    if (g.phase !== 'play') return;
    if (g.timeLeft <= 0){
      this._eliminateCurrent('נגמר הזמן');
      return;
    }
    g.timeLeft--;
    if (!updateTimerOnly(g.timeLeft)) render();
    broadcastTick(g.timeLeft);
    // Auto-play bots in test mode after a small delay
    if (state.isTest && g.currentPlayerId && g.currentPlayerId.startsWith('bot-') && g.timeLeft === Games.wordchain.TURN_TIME - 2){
      this._botAutoPlay();
    }
    this._t = setTimeout(()=>this._tick(), 1000);
  },
  _botAutoPlay(){
    const g = state.currentGame;
    if (!g || g.phase!=='play') return;
    const id = g.currentPlayerId;
    if (!id || !id.startsWith('bot-')) return;
    const found = HEBREW_WORDS.find(w => {
      const start = canonChar(w).slice(0,2);
      return start === g.requiredPrefix && !g.usedWords.has(canonChar(w)) && w.length>=3;
    });
    if (found) this.onAnswer(id, {answer:found});
    else this.onAnswer(id, {answer:'אבדאבדאבד'});
  },
  async onAnswer(fromId, msg){
    const g = state.currentGame;
    if (!g || g.phase !== 'play') return;
    if (g.currentPlayerId !== fromId) return;
    const word = (msg.answer||'').trim();
    if (!word) return;
    // First do quick checks (length / prefix / used)
    let quick = this._quickValidate(word);
    if (quick !== true){
      g.history.push({ by:fromId, byName: state.players[fromId].name, word, ok:false, reason: quick });
      this._eliminateCurrent(quick);
      return;
    }
    // Dict check: local fast, then online fallback. Pause the timer
    // while we check online so the player isn't eliminated by timeout
    // mid-validation.
    let ok = HEBREW_DICT.has(word);
    if (!ok){
      g.phase = 'validating';
      clearTimeout(this._t);
      g.history.push({ by:fromId, byName: state.players[fromId].name, word, ok:'checking', reason: 'בודק...' });
      broadcastState(); render();
      ok = await isHebrewWordOnline(word);
      const idx = g.history.findIndex(h=>h.ok==='checking' && h.word===word);
      if (idx>=0) g.history.splice(idx,1);
      if (ok) HEBREW_DICT.add(word); // cache locally so future turns are instant
      g.phase = 'play';
    }
    if (!ok){
      g.history.push({ by:fromId, byName: state.players[fromId].name, word, ok:false, reason:'לא במילון' });
      this._eliminateCurrent('לא במילון');
      return;
    }
    g.history.push({ by:fromId, byName: state.players[fromId].name, word, ok:true });
    g.usedWords.add(canonChar(word));
    g.usedWordsArr = Array.from(g.usedWords);
    g.lastWord = word;
    g.requiredPrefix = this._lastTwoLetters(word);
    g.turnIdx = (g.turnIdx + 1);
    this._beginTurn();
  },
  _quickValidate(word){
    const g = state.currentGame;
    if (word.length < 3) return 'קצרה מדי';
    const start = canonChar(word).slice(0,2);
    if (start !== g.requiredPrefix) return 'לא מתחיל באותיות הנדרשות';
    if (g.usedWords.has(canonChar(word))) return 'כבר נאמר';
    return true;
  },
  _eliminateCurrent(reason){
    const g = state.currentGame;
    const id = g.currentPlayerId;
    state.players[id].eliminated = true;
    g.history.push({by:id, byName:state.players[id].name, word:'❌ הודח ('+reason+')', dropped:true});
    if (id === state.myId) showToast('הודחת: '+reason, 'error');
    const active = this._activeOrder();
    if (this._checkEnd(active)) return;
    g.turnIdx = g.turnIdx % active.length;
    this._beginTurn();
  },
  _checkEnd(active){
    const g = state.currentGame;
    if (state.mode === 'teams'){
      const teamsAlive = new Set();
      active.forEach(id=> teamsAlive.add(state.players[id].team));
      if (teamsAlive.size <= 1){
        const winner = Array.from(teamsAlive)[0] || null;
        g.winnerEntity = winner;
        if (winner){
          Object.values(state.players).forEach(p=>{ if (p.team===winner) p.score += 30; });
        }
        clearTimeout(this._t);
        g.phase = 'over';
        state.results = { game:'wordchain', winnerEntity: winner, mode:'teams' };
        state.screen = 'roundResults';
        broadcastState(); render();
        return true;
      }
      return false;
    } else {
      if (active.length <= 1){
        const winnerId = active[0] || null;
        g.winnerEntity = winnerId;
        if (winnerId){ state.players[winnerId].score += 30; }
        clearTimeout(this._t);
        g.phase = 'over';
        state.results = { game:'wordchain', winnerEntity: winnerId, mode:'individual' };
        state.screen = 'roundResults';
        broadcastState(); render();
        return true;
      }
      return false;
    }
  },
};

function render(){
  const app = document.getElementById('app');
  app.innerHTML='';
  let view;
  switch (state.screen){
    case 'home': view = renderHome(); break;
    case 'createForm': view = renderCreateForm(); break;
    case 'joinForm': view = renderJoinForm(); break;
    case 'lobby': view = renderLobby(); break;
    case 'modeSelect': view = renderModeSelect(); break;
    case 'game': view = renderGame(); break;
    case 'roundResults': view = renderRoundResults(); break;
    case 'final': view = renderFinal(); break;
    default: view = renderHome();
  }
  app.appendChild(view);
  if (state.screen === 'home'){
    app.appendChild(el('div',{class:'footer-credit'},'Created by Havivon'));
  }
}

function teamPlayersRow(){
  if (state.mode!=='teams') {
    const list = el('div',{class:'player-list'});

  const wrap = el('div',{});

function renderUnscramble(){
  const g = state.currentGame;
  const c = el('div',{class:'card'});
  c.appendChild(gameHeader(GAME_NAMES.unscramble, `סיבוב ${g.round+1}/${Games.unscramble.ROUNDS}`, g.phase==='play'?g.timeLeft:undefined));
  c.appendChild(el('div',{class:'center'}, el('span',{class:'topic-pill'}, 'נושא: '+g.currentItem.topic)));

  // Scrambled letters as tiles
  const tileRow = el('div',{class:'tile-row'});
  g.currentScramble.split('').forEach(ch=>{
    if (ch===' ') tileRow.appendChild(el('div',{class:'tile gap'}));
    else tileRow.appendChild(el('div',{class:'tile'}, ch));
  });
  c.appendChild(tileRow);

  // Answer slots - typed letters appear above underlines
  const target = Array.isArray(g.currentItem.word)?g.currentItem.word:[g.currentItem.word];
  let slots = null;
  if (g.phase==='play'){
    const myP = state.players[state.myId];
    if (!myP || !myP.eliminated){
      slots = makeAnswerSlots(target, (val)=>{
        if (!val.trim()) return;
        sendToHost({type:'answer', answer: val});
        slots && slots.clear();
      });
      c.appendChild(slots.wrap);
      c.appendChild(el('button',{class:'btn btn-p', onclick:()=>{
        const val = slots.ghost.value;
        if (!val.trim()) return;
        sendToHost({type:'answer', answer: val});
        slots.clear();
      }},'שלח תשובה'));
    } else {
      const hint = el('div',{class:'answer-slots'});
      target.forEach((w,wi)=>{
        if (wi>0) hint.appendChild(el('div',{class:'slot-gap'}));
        for (let i=0;i<w.length;i++) hint.appendChild(el('div',{class:'slot'}, ''));
      });
      c.appendChild(hint);
    }
  } else if (g.phase==='reveal'){
    const hint = el('div',{class:'answer-slots'});
    target.forEach((w,wi)=>{
      if (wi>0) hint.appendChild(el('div',{class:'slot-gap'}));
      for (let i=0;i<w.length;i++) hint.appendChild(el('div',{class:'slot filled'}, w[i]));
    });
    c.appendChild(hint);
    c.appendChild(el('div',{class:'msg success'},
      g.lastWinnerName ? `🏆 ${g.lastWinnerName} ענה ראשון!` : `⏰ נגמר הזמן`));
  }
  c.appendChild(el('div',{class:'divider'}));
  c.appendChild(teamPlayersRow());

  if (state.isTest && g.phase==='play'){
    c.appendChild(el('div',{class:'divider'}));
    c.appendChild(testControls('unscramble'));
  }
  return c;
}

function renderAnagram(){
  const g = state.currentGame;
  const c = el('div',{class:'card'});
  c.appendChild(gameHeader(GAME_NAMES.anagram, 'הרכיבו כמה שיותר מילים בנות 4 אותיות ומעלה', g.phase==='play'?g.timeLeft:undefined));
  const grid = el('div',{class:'letters-grid'});
  g.letters.forEach(L => grid.appendChild(el('div',{class:'letter-tile'}, L)));
  c.appendChild(grid);

  if (g.phase==='play'){
    const inp = el('input',{type:'text', placeholder:'הקלד מילה ולחץ Enter...'});
    const myEnt = state.mode==='teams' ? state.players[state.myId]?.team : state.myId;
    const myWords = (g.submissions[myEnt]||[]);
    const sub = ()=>{
      const v = inp.value.trim(); if (!v) return;
      sendToHost({type:'answer', answer:v});
      inp.value='';
    };
    inp.addEventListener('keydown',e=>{ if (e.key==='Enter') sub(); });
    c.appendChild(inp);
    c.appendChild(el('button',{class:'btn btn-p', onclick:sub},'הוסף מילה'));
    setTimeout(()=>inp.focus(),50);

    c.appendChild(el('h3',{style:'margin-top:14px'},'המילים שלי/הקבוצה שלי:'));
    const wl = el('div',{class:'word-list'});
    myWords.forEach(w=> wl.appendChild(el('div',{class:'word-tag'}, w)));
    if (myWords.length===0) wl.appendChild(el('span',{class:'muted-text'},'עדיין אין מילים'));
    c.appendChild(wl);
  }
  c.appendChild(el('div',{class:'divider'}));
  c.appendChild(teamPlayersRow());

  if (state.isTest && g.phase==='play'){
    c.appendChild(el('div',{class:'divider'}));
    c.appendChild(testControls('anagram'));
  }
  return c;
}

function renderWordChain(){
  const g = state.currentGame;
  const c = el('div',{class:'card'});
  c.appendChild(gameHeader(GAME_NAMES.wordchain, '', g.phase==='play'?g.timeLeft:undefined));

  // Last word + required prefix - main visual focus
  c.appendChild(el('div',{class:'wc-last'},
    el('span',{class:'wc-last-label'}, 'המילה האחרונה'),
    el('span',{class:'wc-last-word'}, g.lastWord)
  ));
  c.appendChild(el('div',{class:'wc-prefix-box'},
    el('span',{class:'wc-prefix-label'}, 'המילה הבאה מתחילה ב'),
    el('span',{class:'wc-prefix'}, g.requiredPrefix)
  ));

  if (g.phase==='play'){
    const myTurn = g.currentPlayerId === state.myId;
    const cur = state.players[g.currentPlayerId];
    if (myTurn){
      c.appendChild(el('div',{class:'wc-turn me'}, '✏️ התור שלך – הקלד מילה'));
      const inp = el('input',{type:'text', placeholder:`מילה ב-${g.requiredPrefix}...`, style:'font-size:1.2rem;text-align:center'});
      const sub = ()=>{
        const v = inp.value.trim(); if (!v) return;
        sendToHost({type:'answer', answer:v});
        inp.value='';
      };
      inp.addEventListener('keydown',e=>{ if (e.key==='Enter'){ e.preventDefault(); sub(); }});
      c.appendChild(inp);
      c.appendChild(el('button',{class:'btn btn-p', onclick:sub},'שלח'));
      setTimeout(()=>inp.focus(),50);
    } else {
      c.appendChild(el('div',{class:'wc-turn'}, '⏳ ' + (cur ? `תור של ${cur.name}` : 'מחכים')));
    }
  }

  // Compact participants list
  const alive = Object.values(state.players).filter(p=>!p.eliminated);
  const eliminated = Object.values(state.players).filter(p=>p.eliminated);
  const liveRow = el('div',{class:'player-list', style:'margin-top:18px'});
  alive.forEach(p => liveRow.appendChild(el('div',{class:'player-chip'+(p.id===g.currentPlayerId?' me':'')}, p.name)));
  c.appendChild(liveRow);
  if (eliminated.length){
    const elimRow = el('div',{class:'player-list'});
    eliminated.forEach(p => elimRow.appendChild(el('div',{class:'player-chip eliminated'}, p.name)));
    c.appendChild(elimRow);
  }

  // Compact history (last 3 entries only)
  const recent = g.history.slice(-3).reverse();
  if (recent.length){
    const hist = el('div',{class:'wc-history'});
    recent.forEach(h => {
      const row = el('div',{class:'wc-history-row'+(h.dropped?' dropped':'')});
      row.appendChild(el('span',{class:'wc-history-name'}, h.byName));
      row.appendChild(el('span',{class:'wc-history-word'}, h.word));
      hist.appendChild(row);
    });
    c.appendChild(hist);
  }

  if (state.isTest && g.phase==='play'){
    c.appendChild(el('div',{class:'divider'}));
    c.appendChild(testControls('wordchain'));
  }
  return c;
}

function renderRoundResults(){
  const c = el('div',{class:'card'});
  c.appendChild(el('h2',{},'תוצאות סיבוב'));
  const r = state.results;
  if (!r){ c.appendChild(el('p',{}, 'אין תוצאות')); return c; }

  if (r.game === 'anagram'){
    c.appendChild(el('div',{class:'center', style:'margin-bottom:10px'},
      'אותיות: ', el('strong',{}, state.currentGame.letters.join(' '))));
    Object.entries(r.scoring).forEach(([entity, sc])=>{
      const label = state.mode==='teams' ? (entity==='a'?'🔵 כחולים':'🔴 אדומים') : (state.players[entity]?.name||'שחקן');
      c.appendChild(el('h3',{}, `${label} – ${sc.points} נק'`));
      const wl = el('div',{class:'word-list'});
      sc.valid.forEach(w => wl.appendChild(el('div',{class:'word-tag valid'}, '✓ '+w)));
      sc.invalid.forEach(it => wl.appendChild(el('div',{class:'word-tag invalid'}, '✗ '+it.w)));
      if (sc.valid.length===0 && sc.invalid.length===0) wl.appendChild(el('span',{class:'muted-text'},'אין תשובות'));
      c.appendChild(wl);
    });
    c.appendChild(el('details',{style:'margin-top:10px'},
      el('summary',{style:'cursor:pointer;font-weight:700;color:var(--p1)'},`💡 דוגמאות למילים נוספות שאפשר היה (${r.validWords.length})`),
      el('div',{class:'word-list', style:'margin-top:8px'},
        ...r.validWords.slice(0,40).map(w => el('div',{class:'word-tag'}, w)))
    ));
  }
  else if (r.game === 'categories'){
    c.appendChild(el('div',{class:'center', style:'margin-bottom:10px'},
      'קטגוריה: ', el('strong',{}, r.category)));
    Object.entries(r.perEntity).forEach(([entity, sc])=>{
      const label = state.mode==='teams' ? (entity==='a'?'🔵 כחולים':'🔴 אדומים') : (state.players[entity]?.name||'שחקן');
      c.appendChild(el('h3',{}, `${label} – ${sc.points} נק'`));
      const wl = el('div',{class:'word-list'});
      sc.items.forEach(it => {
        const cls = it.valid ? 'valid' : 'invalid';
        let txt = it.original + (it.merged ? ` (×${it.mergedCount})` : '');
        if (it.valid && it.canonical && fuzzyHe(it.canonical) === fuzzyHe(it.original) && normalizeHe(it.canonical) !== normalizeHe(it.original)){
          txt += ` → ${it.canonical}`;
        }
        wl.appendChild(el('div',{class:'word-tag '+cls}, (it.valid?'✓ ':'✗ ')+txt));
      });
      if (sc.items.length===0) wl.appendChild(el('span',{class:'muted-text'},'אין תשובות'));
      c.appendChild(wl);
    });
  }
  else if (r.game === 'unscramble'){
    c.appendChild(el('p',{class:'sub'}, r.message || 'סוף משחק 1'));
  }
  else if (r.game === 'wordchain'){
    if (r.winnerEntity){
      const label = r.mode==='teams' ? (r.winnerEntity==='a'?'🔵 הקבוצה הכחולה':'🔴 הקבוצה האדומה') : state.players[r.winnerEntity]?.name;
      c.appendChild(el('div',{class:'msg success', style:'font-size:1.3rem'}, '🏆 הניצחון: '+label));
    } else {
      c.appendChild(el('div',{class:'msg warning'}, 'אין מנצח'));
    }
  }

  c.appendChild(el('div',{class:'divider'}));
  c.appendChild(scoreTable());

  if (state.isHost){
    c.appendChild(el('button',{class:'btn btn-p', onclick:()=>GameLogic.nextGame()},
      state.gameIndex+1 < state.gameSequence.length ? `▶ למשחק הבא: ${GAME_NAMES[state.gameSequence[state.gameIndex+1]]}` : '🏁 לתוצאות הסופיות'
    ));
  } else {
    c.appendChild(el('p',{class:'muted-text'},'מחכים שהמארח ימשיך...'));
  }
  return c;
}

function renderFinal(){
  const c = el('div',{class:'card'});
  c.appendChild(el('h1',{},'🏆 תוצאות סופיות'));
  if (state.mode==='teams'){
    const aScore = Object.values(state.players).find(p=>p.team==='a')?.score||0;
    const bScore = Object.values(state.players).find(p=>p.team==='b')?.score||0;
    const winner = aScore>bScore?'🔵 הקבוצה הכחולה':bScore>aScore?'🔴 הקבוצה האדומה':'תיקו!';
    c.appendChild(el('div',{class:'msg success', style:'font-size:1.4rem'}, '🎉 '+winner));
    c.appendChild(el('div',{style:'display:flex;gap:14px;margin:14px 0'},
      el('div',{class:'team-zone a', style:'flex:1;text-align:center'},
        el('h3',{},'🔵 כחולים'), el('div',{style:'font-size:2rem;font-weight:900;color:#1d4ed8'}, aScore+''),
        ...Object.values(state.players).filter(p=>p.team==='a').map(p=>el('div',{},p.name))),
      el('div',{class:'team-zone b', style:'flex:1;text-align:center'},
        el('h3',{},'🔴 אדומים'), el('div',{style:'font-size:2rem;font-weight:900;color:#b91c1c'}, bScore+''),
        ...Object.values(state.players).filter(p=>p.team==='b').map(p=>el('div',{},p.name)))
    ));
  } else {
    c.appendChild(scoreTable(true));
  }

  if (state.isHost){
    c.appendChild(el('button',{class:'btn btn-g', onclick:()=>GameLogic.replayMatch()}, '🔁 משחק נוסף עם אותם שחקנים'));
    c.appendChild(el('button',{class:'btn btn-mute', onclick:()=>GameLogic.backToLobby()}, '← חזרה ללובי'));
  } else {
    c.appendChild(el('p',{class:'muted-text'},'מחכים להחלטת המארח...'));
  }
  setTimeout(()=>emojiBurst('🎉'),100);
  return c;
}

function scoreTable(highlight=false){
  const tbl = el('table',{class:'score-table'});
  tbl.appendChild(el('thead',{}, el('tr',{}, el('th',{},'שחקן'), el('th',{},'קבוצה'), el('th',{},'ניקוד'))));
  const tb = el('tbody',{});
  const sorted = Object.values(state.players).slice().sort((a,b)=>b.score-a.score);
  sorted.forEach((p,i)=>{
    const teamLabel = p.team==='a'?'🔵':p.team==='b'?'🔴':'-';
    let badge = '';
    if (highlight && i===0) badge = el('span',{class:'badge gold'},'🥇');
    else if (highlight && i===1) badge = el('span',{class:'badge silver'},'🥈');
    else if (highlight && i===2) badge = el('span',{class:'badge bronze'},'🥉');
    tb.appendChild(el('tr',{}, el('td',{}, badge||'', ' ', p.name), el('td',{},teamLabel), el('td',{}, p.score+'')));
  });
  tbl.appendChild(tb);
  return tbl;
}

/* ============================================================
   TEST MODE (solo - simulate everything)
   ============================================================ */

function startTestMode(){
  state.isTest = true;
  state.isHost = true;
  state.myId = 'test-me';
  state.myName = 'אני (בדיקה)';
  state.gameCode = 'TEST1';
  state.players = {
    'test-me': {id:'test-me', name:'אני (בדיקה)', team:null, score:0, eliminated:false, connected:true},
    'bot-1': {id:'bot-1', name:'בוט אלפא', team:null, score:0, eliminated:false, connected:true},
    'bot-2': {id:'bot-2', name:'בוט בטא', team:null, score:0, eliminated:false, connected:true},
    'bot-3': {id:'bot-3', name:'בוט גמא', team:null, score:0, eliminated:false, connected:true},
  };
  state.screen = 'lobby';
  render();
}

function testControls(gameName){
  const wrap = el('div',{class:'test-controls'});
  wrap.appendChild(el('div',{class:'muted-text', style:'width:100%;text-align:center'},'🧪 כלי בדיקה:'));
  // Skip game
  wrap.appendChild(el('button',{class:'btn btn-mute btn-sm', onclick:()=>{
    if (gameName==='unscramble'){
      const g = state.currentGame; g.timeLeft = 0; g.phase = 'reveal';
      g.lastAnswer = Array.isArray(g.currentItem.word)?g.currentItem.word.join(' '):g.currentItem.word;
      clearTimeout(Games.unscramble._t);
      Games.unscramble._t = setTimeout(()=>{ g.round = Games.unscramble.ROUNDS; Games.unscramble._finishGame(); },800);
      render();
    } else if (gameName==='anagram'){
      Games.anagram._finish();
    } else if (gameName==='categories'){
      Games.categories._finish();
    } else if (gameName==='wordchain'){
      // eliminate everyone except me
      Object.values(state.players).forEach(p=>{ if (p.id!==state.myId) p.eliminated=true; });
      Games.wordchain._checkEnd(Games.wordchain._activeOrder());
    }
  }},'⏭ דלג למסך תוצאות'));

  // Bots fill in
  if (gameName==='anagram'){
    wrap.appendChild(el('button',{class:'btn btn-s btn-sm', onclick:()=>{
      const g = state.currentGame;
      const valid = g.validWords.slice(0,8);
      ['bot-1','bot-2','bot-3'].forEach((id,i)=>{
        valid.slice(i, i+4).forEach(w => Games.anagram.onAnswer(id, {answer:w}));
        // add an invalid one too
        Games.anagram.onAnswer(id, {answer:'בלהבלה'+i});
      });
      render();
    }},'🤖 בוטים שולחים מילים'));
  }
  if (gameName==='categories'){
    wrap.appendChild(el('button',{class:'btn btn-s btn-sm', onclick:()=>{
      const g = state.currentGame;
      const ans = g.validAnswers;
      ['bot-1','bot-2','bot-3'].forEach((id,i)=>{
        for (let k=0;k<4;k++){
          const w = ans[(i*3+k) % ans.length];
          Games.categories.onAnswer(id, {answer:w});
        }
        Games.categories.onAnswer(id, {answer:'תשובהמומצאת'+i});
      });
      render();
    }},'🤖 בוטים שולחים תשובות'));
  }
  if (gameName==='wordchain'){
    wrap.appendChild(el('button',{class:'btn btn-s btn-sm', onclick:()=>{
      // Bot tries to play if it's their turn
      const g = state.currentGame;
      const id = g.currentPlayerId;
      if (id===state.myId) { showToast('זה התור שלך - הקלד בעצמך','warning'); return; }
      // Try to find a valid word in dict
      const found = HEBREW_WORDS.find(w => {
        const start = canonChar(w).slice(0,2);
        return start === g.requiredPrefix && !g.usedWords.has(canonChar(w)) && w.length>=3;
      });
      if (found) Games.wordchain.onAnswer(id, {answer:found});
      else Games.wordchain.onAnswer(id, {answer:'שטויות'}); // will eliminate
    }},'🤖 הבוט הנוכחי משחק'));
  }
  return wrap;
}

window.addEventListener('DOMContentLoaded', ()=>{
  render();
});
